# Netlify build configuration for the Crown Pierce portfolio (Next.js).
# The Next.js app lives in the portfolio/ subfolder; Netlify treats it as the
# site root via base. The Next.js Runtime plugin handles serverless API routes
# (e.g. /api/chat) and static optimization automatically.

[build]
  base = "portfolio"
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"
